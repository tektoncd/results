coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default: false

ignore:
  # Auto-generated protobuf code.
  - "proto"
  - "**/*.pb.go"
  - "**/fake/**"
  # Entry-point binaries.
  - "cmd"
  # Test infrastructure.
  - "test"
  - "pkg/test/"
  - "pkg/internal/test/"
  - "pkg/api/server/test/"
  - "internal/fieldmask/test/"
  - "pkg/cli/testutils/"
  # Non-executable files (doc, go:generate).
  - "**/doc.go"
  - "**/generate.go"
  - "config"
  - "hack"
  - "tools"
  - "release"
  - "tekton"
  - "docs"
  - "vendor"
