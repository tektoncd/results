name: Results CI Presubmit Tests

on:
  pull_request:
    branches:
      - main
      - release-*
  workflow_call:
    inputs:
      skip-ci-summary:
        description: >-
          When true the ci-summary job is skipped. Callers that need to
          report their own "CI summary" check (to satisfy branch protection
          rules that expect the unprefixed name) should set this to true
          and define the summary job themselves.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHELL: /bin/bash
  GOPATH: ${{ github.workspace }}
  GO111MODULE: on
  KIND_CLUSTER_NAME: tekton-results

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ github.workspace }}/src/github.com/tektoncd/results
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          cache-dependency-path: src/github.com/tektoncd/results/go.sum
          go-version-file: src/github.com/tektoncd/results/go.mod

      - name: Install dependencies
        run: |
          go install github.com/jstemmer/go-junit-report@v0.9.1
          mkdir -p "${ARTIFACTS:-/tmp/artifacts}"
          echo "${GOPATH}/bin" >> "$GITHUB_PATH"

      - name: Run Unit Tests
        working-directory: ${{ github.workspace }}/src/github.com/tektoncd/results
        run: ./test/presubmit-tests.sh --unit-tests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ github.workspace }}/src/github.com/tektoncd/results
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          cache-dependency-path: src/github.com/tektoncd/results/go.sum
          go-version-file: src/github.com/tektoncd/results/go.mod

      - name: Install dependencies (ko, kind, kubectl, go-junit-report)
        run: |
          echo '::group::install ko'
          curl -L https://github.com/ko-build/ko/releases/download/v0.15.4/ko_0.15.4_Linux_x86_64.tar.gz | tar xzf - ko
          chmod +x ./ko && sudo mv ko /usr/local/bin
          echo '::endgroup::'

          echo '::group::install kind'
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          echo '::endgroup::'

          echo '::group::install kubectl'
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          echo '::endgroup::'

          echo '::group::install go-junit-report'
          go install github.com/jstemmer/go-junit-report@v0.9.1
          echo '::endgroup::'

          mkdir -p "${ARTIFACTS:-/tmp/artifacts}"
          echo "${GOPATH}/bin" >> "$GITHUB_PATH"

      - name: Run Integration Tests
        working-directory: ${{ github.workspace }}/src/github.com/tektoncd/results
        run: ./test/presubmit-tests.sh --integration-tests

  build-tests:
    name: Build Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ github.workspace }}/src/github.com/tektoncd/results
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          cache-dependency-path: src/github.com/tektoncd/results/go.sum
          go-version-file: src/github.com/tektoncd/results/go.mod

      - name: Install dependencies (go-junit-report, go-licenses)
        run: |
          echo '::group::install go-junit-report'
          go install github.com/jstemmer/go-junit-report@v0.9.1
          echo '::endgroup::'

          echo '::group::install go-licenses'
          go install github.com/google/go-licenses@latest
          echo '::endgroup::'

          mkdir -p "${ARTIFACTS:-/tmp/artifacts}"
          echo "${GOPATH}/bin" >> "$GITHUB_PATH"

      - name: Run Build Tests
        working-directory: ${{ github.workspace }}/src/github.com/tektoncd/results
        run: ./test/presubmit-tests.sh --build-tests

  db-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ github.workspace }}/src/github.com/tektoncd/results
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          cache-dependency-path: src/github.com/tektoncd/results/go.sum
          go-version-file: src/github.com/tektoncd/results/go.mod

      # Released migrations may already be applied to user databases, so they
      # must never change. Fixes go into a new migration.
      - name: Check published migrations are unchanged
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}/src/github.com/tektoncd/results
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=DMRT "${BASE_SHA}...HEAD" -- 'pkg/api/server/db/migrations/*.sql')
          if [ -n "${changed}" ]; then
            echo "::error::Existing migration files must not be modified, renamed or deleted; add a new migration instead:"
            echo "${changed}"
            exit 1
          fi

      - name: Run migration tests against Postgres
        working-directory: ${{ github.workspace }}/src/github.com/tektoncd/results
        env:
          DB_URL: host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=disable
        run: go test -tags=e2e -count=1 ./pkg/api/server/db/migrations/...

  ci-summary:
    name: CI summary
    if: ${{ always() && !inputs.skip-ci-summary }}
    needs:
      - unit-tests
      - integration-tests
      - build-tests
      - db-migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=(${JOB_RESULTS})
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
