# In-cluster MinIO for blob log e2e tests.
# Replaces the external play.min.io dependency.
# Uses pgsty/minio (community fork) because upstream quay.io/minio/minio
# was archived in Oct 2025 and now returns 401 on anonymous pulls.
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: tekton-pipelines
type: Opaque
stringData:
  MINIO_ROOT_USER: "tekton-results"
  MINIO_ROOT_PASSWORD: "tekton-results-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: tekton-pipelines
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z-amd64
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - mountPath: /data
              name: data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: tekton-pipelines
  labels:
    app: minio
spec:
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: minio
---
# Job that creates the tekton-logs bucket after MinIO is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: tekton-pipelines
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z-amd64
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio.tekton-pipelines.svc.cluster.local:9000 \
                "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              mc mb --ignore-existing local/tekton-logs
              echo "Bucket tekton-logs created."
          envFrom:
            - secretRef:
                name: minio-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
