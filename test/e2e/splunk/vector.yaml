role: Agent
customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: true
    address: 127.0.0.1:8686
  sources:
    kubernetes_logs:
      type: kubernetes_logs
      extra_label_selector: "app.kubernetes.io/managed-by=tekton-pipelines"
      #Poll often enough to see short-lived step containers.
      glob_minimum_cooldown_ms: 1000
      read_from: beginning
  transforms:
    remap_app_logs:
      type: remap
      inputs: [kubernetes_logs]
      source: |-
        .message = string!(.message)
        .structured.msg = ""
        .kubernetes.namespace_name = .kubernetes.pod_namespace
        if exists(.kubernetes.pod_labels."tekton.dev/pipelineRunUID") {
          .kubernetes.labels.tekton_dev_pipelineRunUID = .kubernetes.pod_labels."tekton.dev/pipelineRunUID"
        }
        if exists(.kubernetes.pod_labels."tekton.dev/taskRunUID") {
          .kubernetes.labels.tekton_dev_taskRunUID = .kubernetes.pod_labels."tekton.dev/taskRunUID"
        }
  sinks:
    splunk_hec:
      type: splunk_hec_logs
      inputs: ["remap_app_logs"]
      endpoint: "https://splunk.logging.svc.cluster.local:8088"
      default_token: "abcd1234-hec-token-e2e-0001"
      index: "main"
      sourcetype: "_json"
      compression: none
      batch:
        max_events: 50
        timeout_secs: 1
      tls:
        verify_certificate: false
      encoding:
        codec: json