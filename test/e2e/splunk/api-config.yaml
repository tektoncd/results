---
apiVersion: v1
data:
  config: |
    DB_USER=
    DB_PASSWORD=
    DB_HOST=tekton-results-postgres-service.tekton-pipelines.svc.cluster.local
    DB_PORT=5432
    DB_NAME=tekton-results
    DB_SSLMODE=disable
    DB_ENABLE_AUTO_MIGRATION=true
    SERVER_PORT=8080
    PROMETHEUS_PORT=9090
    PROMETHEUS_HISTOGRAM=false
    TLS_PATH=/etc/tls
    AUTH_DISABLE=false
    AUTH_IMPERSONATE=true
    LOG_LEVEL=debug
    LOGS_API=true
    LOGS_TYPE=Splunk
    LOGS_BUFFER_SIZE=32768
    LOGS_PATH=/logs
    LOGGING_PLUGIN_STATIC_LABELS=
    LOGGING_PLUGIN_TOKEN_PATH=/var/run/secrets/kubernetes.io/serviceaccount/token
    LOGGING_PLUGIN_PROXY_PATH=
    LOGGING_PLUGIN_NAMESPACE_KEY=kubernetes.namespace_name
    LOGGING_PLUGIN_CONTAINER_KEY=kubernetes.container_name
    LOGGING_PLUGIN_API_URL=https://splunk.logging.svc.cluster.local:8089
    LOGGING_PLUGIN_FORWARDER_DELAY_DURATION=5
    LOGGING_PLUGIN_QUERY_LIMIT=1700
    LOGGING_PLUGIN_QUERY_PARAMS=index=main
    LOGGING_PLUGIN_TLS_VERIFICATION_DISABLE=true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: tekton-results
    app.kubernetes.io/version: devel
  name: tekton-results-api-config
  namespace: tekton-pipelines
