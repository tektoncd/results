# TaskRun used by blob log e2e tests. Each step produces distinct, known
# output so the test can verify per-container log identity.
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: blob-log-test
spec:
  serviceAccountName: default
  taskSpec:
    steps:
      - name: first
        image: alpine
        command: ["sh", "-c", "echo BLOB_LOG_MARKER_FIRST"]
      - name: second
        image: alpine
        command: ["sh", "-c", "echo BLOB_LOG_MARKER_SECOND"]
