# Fixed PostgreSQL tuning for reproducible tier-2 benchmarks (ephemeral OpenShift).
#
# Same role as the tier-1 file, sized to fit the memory and disk limits declared in
# postgres-patch.yaml. It is the single source of truth for database configuration
# during a tier-2 run and is loaded via conf.d/override.conf (see postgres-patch.yaml).
# If you change the container limits there, change these in step.
#
# Keep these values version-controlled and stable: changing them changes results,
# so a change should be treated like a dataset-version bump and noted in the
# report/baseline metadata.

# Memory — kept within the 3Gi container limit in postgres-patch.yaml.
# shared_buffers is ~25% of that limit; work_mem is deliberately small because up
# to BENCH_CONCURRENCY backends may run sorts/hashes at once (peak ~= work_mem x
# active backends). effective_cache_size is a planner hint, not an allocation.
shared_buffers = 768MB
work_mem = 8MB
maintenance_work_mem = 256MB
effective_cache_size = 2GB

# Write-ahead log — bounded to fit the Postgres data volume: pg_wal shares the
# StatefulSet PVC, so max_wal_size must stay well under its capacity.
wal_buffers = 16MB
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Planner — assume SSD-backed storage.
random_page_cost = 1.1
effective_io_concurrency = 200

# Parallelism — let large label/index scans use multiple workers.
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# Connections — headroom over BENCH_CONCURRENCY without over-committing work_mem.
max_connections = 100

# Deterministic autovacuum so background work does not skew back-to-back runs.
autovacuum = on
autovacuum_naptime = 10s
