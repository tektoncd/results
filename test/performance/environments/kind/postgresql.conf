# Fixed PostgreSQL tuning for reproducible tier-1 benchmarks.
#
# This file is the single source of truth for database configuration during a
# benchmark run. It is loaded via conf.d/override.conf (bitnami's postgresql.conf
# ends with `include_dir 'conf.d'`), so these settings override the image
# defaults without clobbering bitnami's generated pg_hba.conf / postgresql.conf.
#
# Keep these values version-controlled and stable: changing them changes results,
# so a change should be treated like a dataset-version bump and noted in the
# report/baseline metadata.

# Memory
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1536MB

# Write-ahead log — sized for sustained ingest without excessive checkpointing.
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# Planner — assume SSD-backed storage on CI/kind nodes.
random_page_cost = 1.1
effective_io_concurrency = 200

# Connections — match the harness concurrency ceiling with headroom.
max_connections = 100

# Deterministic autovacuum so background work does not skew back-to-back runs.
autovacuum = on
autovacuum_naptime = 10s
