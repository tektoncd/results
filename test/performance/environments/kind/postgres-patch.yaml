# Strategic-merge patch: pin Postgres resources for reproducibility and mount the
# fixed postgresql.conf tuning into bitnami's conf.d.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tekton-results-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: postgres-tuning
              mountPath: /opt/bitnami/postgresql/conf/conf.d/override.conf
              subPath: override.conf
      volumes:
        - name: postgres-tuning
          configMap:
            name: postgres-tuning
            items:
              - key: postgresql.conf
                path: override.conf
