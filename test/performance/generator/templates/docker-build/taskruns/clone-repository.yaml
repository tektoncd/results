  taskSpec:
    description: Clone a git repository and store it as an OCI artifact
    params:
    - description: Repository URL to clone
      name: url
      type: string
    - default: ""
      description: Revision to checkout
      name: revision
      type: string
    - default: "1"
      description: Git clone depth
      name: depth
      type: string
    - default: "true"
      description: Enable symlink checking
      name: enableSymlinkCheck
      type: string
    - description: OCI storage location
      name: ociStorage
      type: string
    - default: ""
      description: OCI artifact expiration
      name: ociArtifactExpiresAfter
      type: string
    results:
    - description: The URL of the cloned repository
      name: url
      type: string
    - description: The commit SHA
      name: commit
      type: string
    - description: Short commit SHA
      name: short-commit
      type: string
    - description: Commit timestamp
      name: commit-timestamp
      type: string
    - description: OCI artifact reference
      name: SOURCE_ARTIFACT
      type: string
    steps:
    - computeResources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 256Mi
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel8:v1.15
      name: clone
      script: |
        #!/usr/bin/env sh
        set -eu
        git clone --depth=$(params.depth) $(params.url) /workspace/source
        cd /workspace/source
        git checkout $(params.revision)
    - image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      name: symlink-check
      script: |
        #!/usr/bin/env bash
        if [ "$(params.enableSymlinkCheck)" == "true" ]; then
          find /workspace/source -type l
        fi
    - image: quay.io/konflux-ci/oras:latest
      name: store-source-in-oci
      script: |
        #!/usr/bin/env bash
        oras push $(params.ociStorage) /workspace/source:application/vnd.konflux.source
    workspaces:
    - name: basic-auth
      optional: true
