    steps:
      - computeResources:
          limits:
            memory: 2Gi
          requests:
            cpu: 350m
            memory: 2Gi
        env:
          - name: KBC_GIT_CLONE_URL
            value: https://example.com/perf/perf-tenant
          - name: KBC_GIT_CLONE_REVISION
            value: "0000000000000000000000000000000000000000"
          - name: KBC_GIT_CLONE_REFSPEC
