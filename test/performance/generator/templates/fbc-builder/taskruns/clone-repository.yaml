            value: "true"
          - name: KBC_GIT_CLONE_SUBMODULE_PATHS
          - name: KBC_GIT_CLONE_DEPTH
            value: "1"
          - name: KBC_GIT_CLONE_SHORT_COMMIT_LENGTH
            value: "7"
          - name: KBC_GIT_CLONE_SSL_VERIFY
            value: "true"
          - name: KBC_GIT_CLONE_SPARSE_CHECKOUT_DIRECTORIES
          - name: KBC_GIT_CLONE_ENABLE_SYMLINK_CHECK
            value: "true"
          - name: KBC_GIT_CLONE_SYMLINK_CHECK_IGNORE_PATTERN
          - name: KBC_GIT_CLONE_FETCH_TAGS
            value: "false"
          - name: KBC_GIT_CLONE_MERGE_TARGET_BRANCH
            value: "false"
          - name: KBC_GIT_CLONE_TARGET_BRANCH
            value: main
          - name: KBC_GIT_CLONE_MERGE_SOURCE_REPO_URL
          - name: KBC_GIT_CLONE_MERGE_SOURCE_DEPTH
          - name: KBC_GIT_CLONE_BASIC_AUTH_DIRECTORY
            value: /workspace/basic-auth
          - name: KBC_GIT_CLONE_SSH_DIRECTORY
          - name: PARAM_HTTP_PROXY
          - name: PARAM_HTTPS_PROXY
          - name: PARAM_NO_PROXY
          - name: KBC_LOG_LEVEL
            value: info
          - name: KBC_GIT_CLONE_OUTPUT_DIR
            value: /var/workdir
          - name: KBC_GIT_CLONE_SUBDIRECTORY
            value: source
        image: quay.io/konflux-ci/konflux-build-cli:latest@sha256:9919b758fe8096c22cee3c881213e8cca4220ac449c2432d7cf08a5730348383
        name: clone
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          ca_bundle=/mnt/trusted-ca/ca-bundle.crt
          if [ -f "$ca_bundle" ]; then
            echo "INFO: Using mounted CA bundle: $ca_bundle"
            cp -vf "$ca_bundle" /etc/pki/ca-trust/source/anchors
            update-ca-trust
          fi

          test -z "${PARAM_HTTP_PROXY}" || export HTTP_PROXY="${PARAM_HTTP_PROXY}"
          test -z "${PARAM_HTTPS_PROXY}" || export HTTPS_PROXY="${PARAM_HTTPS_PROXY}"
          test -z "${PARAM_NO_PROXY}" || export NO_PROXY="${PARAM_NO_PROXY}"

          RESULT_FILE="$(mktemp)"
          konflux-build-cli git-clone >"${RESULT_FILE}"

          printf "%s" "$(jq -r '.commit' "${RESULT_FILE}")" >"/tekton/results/commit"
          printf "%s" "$(jq -r '.shortCommit' "${RESULT_FILE}")" >"/tekton/results/short-commit"
          printf "%s" "$(jq -r '.url' "${RESULT_FILE}")" >"/tekton/results/url"
          printf "%s" "$(jq -r '.commitTimestamp' "${RESULT_FILE}")" >"/tekton/results/commit-timestamp"
          printf "%s" "$(jq -r '."CHAINS-GIT_URL"' "${RESULT_FILE}")" >"/tekton/results/CHAINS-GIT_URL"
          printf "%s" "$(jq -r '."CHAINS-GIT_COMMIT"' "${RESULT_FILE}")" >"/tekton/results/CHAINS-GIT_COMMIT"

          MERGED_SHA=$(jq -r '.mergedSha // empty' "${RESULT_FILE}")
          if [ -n "${MERGED_SHA}" ]; then
            printf "%s" "${MERGED_SHA}" >"/tekton/results/merged_sha"
          fi
        securityContext:
          runAsUser: 0
        volumeMounts:
          - mountPath: /mnt/trusted-ca
            name: trusted-ca
            readOnly: true
          - mountPath: /var/workdir
            name: workdir
      - args:
          - create
          - --store
          - quay.io/redhat-user-workloads/perf-tenant/perf/perf-tenant-v0:0000000000000000000000000000000000000000.git
          - /tekton/results/SOURCE_ARTIFACT=/var/workdir/source
        computeResources:
          limits:
            memory: 3Gi
          requests:
            cpu: "1"
            memory: 3Gi
        env:
          - name: IMAGE_EXPIRES_AFTER
        image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:7c51a3530f239323442e28ea7dace8b88a14638d823d5eaa8514843c33b03c02
        name: create-trusted-artifact
        volumeMounts:
          - mountPath: /var/workdir
            name: workdir
          - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
            name: trusted-ca
            readOnly: true
            subPath: ca-bundle.crt
    volumes:
      - configMap:
          items:
            - key: ca-bundle.crt
              path: ca-bundle.crt
          name: trusted-ca
          optional: true
        name: trusted-ca
      - emptyDir: {}
        name: workdir
    workspaces:
      - description: |
          A Workspace containing a .gitconfig and .git-credentials file or username and password.
          These will be copied to the user's home before any git commands are run. Any
          other files in this Workspace are ignored. It is strongly recommended
          to use ssh-directory over basic-auth whenever possible and to bind a
          Secret to this Workspace over other volume types.
        name: basic-auth
        optional: true
      - description: |
          A .ssh directory with private key, known_hosts, config, etc. Copied to
          the user's home before git commands are executed. Used to authenticate
          with the git remote when performing the clone. Binding a Secret to this
          Workspace is strongly recommended over other volume types.
        name: ssh-directory
        optional: true
