apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: simple-build-build-container
  namespace: default
  labels:
    tekton.dev/pipeline: docker-build
    tekton.dev/pipelineTask: build-container
    appstudio.openshift.io/application: sample-app
    appstudio.openshift.io/component: sample-component
  annotations:
    chains.tekton.dev/signed: "true"
spec:
  params:
    - name: IMAGE
      value: quay.example.test/org/sample-component:latest
    - name: DOCKERFILE
      value: ./Dockerfile
    - name: CONTEXT
      value: .
    - name: HERMETIC
      value: "false"
    - name: BUILD_ARGS
      value: []
  taskRef:
    resolver: bundles
    params:
      - name: name
        value: buildah
      - name: bundle
        value: quay.example.test/konflux-ci/tekton-catalog/task-buildah:latest
      - name: kind
        value: task
  serviceAccountName: appstudio-pipeline
  timeout: 1h0m0s
status:
