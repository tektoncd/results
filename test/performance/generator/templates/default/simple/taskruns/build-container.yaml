  podName: simple-build-build-container-pod
  steps:
    - name: build
      terminated:
        exitCode: 0
        reason: Completed
        startedAt: "2026-01-01T00:01:10Z"
        finishedAt: "2026-01-01T00:08:40Z"
    - name: sbom-syft-generate
