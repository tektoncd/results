# Applies pending database schema migrations of this release. API servers and
# the retention policy agent refuse to start until the schema version they
# require is in place. Migrations are additive, so servers of the previous
# release keep running while this Job runs. See docs/database-migrations.md.
#
# The Job template is immutable: delete the finished Job before applying a
# different release if it has not been removed by ttlSecondsAfterFinished yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: tekton-results-db-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tekton-results-db-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/os
                  operator: NotIn
                  values:
                  - windows
      containers:
        - name: db-migrate
          image: ko://github.com/tektoncd/results/cmd/results-admin
          args: ["--wait-for-database=10m", "migrate-up"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tekton-results-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tekton-results-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/tekton/results
              readOnly: true
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: tekton-results-api-config
