apiVersion: v1
kind: ServiceAccount
metadata:
  name: retention-policy-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: retention-policy-agent
rules:
  # The agent reads its configuration from ConfigMaps and watches them for
  # changes.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Required by the namespace cleanup, to detect the namespaces that have been
  # removed from the cluster. Only list is needed, the agent lists the
  # namespaces when the retention job runs instead of watching them.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: retention-policy-agent
subjects:
  - kind: ServiceAccount
    name: retention-policy-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-results-retention-policy-agent
